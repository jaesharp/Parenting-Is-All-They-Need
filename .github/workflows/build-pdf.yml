name: Build and Check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install LaTeX linting tools
      run: |
        sudo apt-get update
        sudo apt-get install -y chktex lacheck
        pip install --user proselint
        
    - name: Run ChkTeX
      run: |
        find article/sections -name "*.tex" -exec chktex -q {} \; | tee chktex-report.txt
        # ChkTeX returns non-zero for warnings, so we don't fail the build
      continue-on-error: true
      
    - name: Run lacheck
      run: |
        find article -name "*.tex" -exec lacheck {} \; | tee lacheck-report.txt
      continue-on-error: true
      
    - name: Run proselint on LaTeX content
      run: |
        find article/sections -name "*.tex" -exec proselint {} \; | tee proselint-report.txt
      continue-on-error: true
      
    - name: Check for common LaTeX issues
      run: |
        echo "Checking for common issues..."
        # Check for undefined references
        ! grep -r "undefined" article/*.log 2>/dev/null
        # Check for overfull hboxes (lines too long)
        ! grep -r "Overfull.*hbox" article/*.log 2>/dev/null || echo "::warning::Found overfull hboxes"
      continue-on-error: true
      
    - name: Upload lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: |
          *-report.txt
        retention-days: 7

  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Cache Tectonic packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/Tectonic
        key: ${{ runner.os }}-tectonic-${{ hashFiles('article/main.tex', 'article/sections/*.tex') }}
        restore-keys: |
          ${{ runner.os }}-tectonic-
          
    - name: Install Tectonic
      run: |
        # Install Tectonic using GitHub releases
        TECTONIC_VERSION="0.15.0"
        wget https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz
        tar -xzf tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz
        sudo mv tectonic /usr/local/bin/
        tectonic --version
        
    - name: Install additional tools
      run: |
        sudo apt-get update
        sudo apt-get install -y make
        
    - name: Verify installations
      run: |
        tectonic --version
        make --version
        
    - name: Pre-download Tectonic dependencies
      run: |
        # Run tectonic once to download all dependencies with caching
        cd article
        # Use --keep-logs to see what's being downloaded
        tectonic --keep-logs main.tex || echo "Initial run may fail, that's ok"
        echo "Dependencies downloaded to cache"
        
    - name: Run make check
      run: make check
      continue-on-error: true
      
    - name: Build PDF (AMS style)
      run: |
        mkdir -p build
        cd article
        tectonic --keep-logs --keep-intermediates -o ../build main-ams.tex
        echo "Built AMS version successfully"
      
    - name: Build PDF (Original ACM - will fail without class)
      run: make pdf
      working-directory: ./article
      continue-on-error: true
      
    - name: Build with bibliography
      run: make full
      working-directory: ./article
      continue-on-error: true  # Bibliography might fail if refs are incomplete
      
    - name: Count pages
      run: |
        sudo apt-get install -y poppler-utils
        if [ -f "build/main-ams.pdf" ]; then
          echo "=== AMS Version ===" | tee page-count.txt
          pdfinfo build/main-ams.pdf | grep Pages | tee -a page-count.txt
        fi
        if [ -f "article/main.pdf" ]; then
          echo "=== ACM Version ===" | tee -a page-count.txt
          pdfinfo article/main.pdf | grep Pages | tee -a page-count.txt
        fi
        
    - name: Check PDF metadata
      run: |
        if [ -f "build/main-ams.pdf" ]; then
          echo "=== AMS Version ===" | tee pdf-metadata.txt
          pdfinfo build/main-ams.pdf | tee -a pdf-metadata.txt
        fi
        
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: parenting-is-all-they-need
        path: |
          ./build/main-ams.pdf
          ./article/main.pdf
        if-no-files-found: warn
        retention-days: 30
        
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          ./article/*.log
          page-count.txt
          pdf-metadata.txt
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Download PDF artifact
      uses: actions/download-artifact@v4
      with:
        name: parenting-is-all-they-need
        
    - name: Create timestamp
      id: timestamp
      run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
      
    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        tag_name: draft-${{ steps.timestamp.outputs.date }}
        name: Draft Build ${{ steps.timestamp.outputs.date }}
        body: |
          ## Draft Build
          
          This is an automated draft build of "Parenting Is All They Need".
          
          **Status**: Pre-preprint draft - content subject to change
          
          ### Changes
          - See commit history for recent updates
          
          ### Note
          This is not a final version. Citations and conclusions may change.
        files: main.pdf